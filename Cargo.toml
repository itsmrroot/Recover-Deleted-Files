[package]
name = "wdfr"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Recover deleted photos, videos, documents and other files from NTFS, FAT and exFAT volumes, raw disks and disk images"
authors = ["Bashar Salmo"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/itsmrroot/Recover-Deleted-Files--Release"
readme = "README.md"
keywords = ["data-recovery", "undelete", "forensics", "ntfs", "file-carving"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "wdfr"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
csv = "1.4.0"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
env_logger = "0.11.11"
flate2 = "1.1.10"
globset = "0.4.20"
indicatif = "0.18.6"
log = "0.4.34"
memchr = "2.8.3"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

# The crypto is slow unoptimised (BitLocker key stretching, AES).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.release]
# Thin LTO: about half the build time of full LTO, with the same speed
# (byte-level deep search measured) for a somewhat larger program.
lto = "thin"
strip = true

[workspace]
members = ["gui"]
