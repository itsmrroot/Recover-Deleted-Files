[package]
name = "wdfr"
version = "0.3.6"
edition = "2024"
rust-version = "1.88"
description = "Recover deleted photos, videos, documents and other files from NTFS, FAT and exFAT volumes, raw disks and disk images"
authors = ["Bashar Salmo"]
license = "MIT"
repository = "https://github.com/itsmrroot/Recover-Deleted-Files"
readme = "README.md"
keywords = ["data-recovery", "undelete", "forensics", "ntfs", "file-carving"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "wdfr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
csv = "1.4.0"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
env_logger = "0.11.11"
globset = "0.4.20"
indicatif = "0.18.6"
log = "0.4.34"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
members = ["gui"]
