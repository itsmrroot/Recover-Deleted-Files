name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS packages contain the desktop app and the command line.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, packages: "-p wdfr -p wdfr-gui", bins: "wdfr.exe wdfr-gui.exe" }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, packages: "-p wdfr -p wdfr-gui", bins: "wdfr.exe wdfr-gui.exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, packages: "-p wdfr -p wdfr-gui", bins: "wdfr wdfr-gui" }
          - { os: macos-latest, target: x86_64-apple-darwin, packages: "-p wdfr -p wdfr-gui", bins: "wdfr wdfr-gui" }
          # Linux: a fully static command line, plus the desktop app (which
          # loads the system's graphics libraries, so it is built for glibc).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: "-p wdfr", bins: "wdfr" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, packages: "-p wdfr-gui", bins: "wdfr-gui", suffix: "-desktop" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Package
        shell: bash
        run: |
          name=wdfr-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}
          mkdir "$name"
          for b in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          cp README.md LICENSE "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
