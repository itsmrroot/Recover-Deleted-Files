name: Release

on:
  push:
    tags: ["v*"]

# The source is private. Downloads, release notes and the README are
# published to the public release repository, with RELEASE_TOKEN (a token
# that can write to it); the in-app update check reads releases from there.
# Every release is also kept in this (private) repository.
permissions:
  contents: write

env:
  PUBLIC_REPO: itsmrroot/Recover-Deleted-Files--Release

jobs:
  page:
    name: Public page and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update the public README
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" public
          rm -rf public/assets public/gui
          mkdir -p public/assets public/gui/assets/fonts
          cp LICENSE THIRD-PARTY-NOTICES.txt public/
          cp assets/banner.svg assets/how-it-works.svg assets/app-*.png public/assets/
          cp gui/assets/fonts/OFL.txt gui/assets/fonts/OFL-NotoSansSC.txt public/gui/assets/fonts/
          # Without the parts about the (private) source code.
          python3 -c "import re; s = open('README.md').read(); open('public/README.md', 'w').write(re.sub(r'<!-- private:start -->.*?<!-- private:end -->\n*', '', s, flags=re.S))"
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Deleted Files Recovery ${GITHUB_REF_NAME}"
          git push -q origin HEAD:main
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # This version's section of CHANGES.md; the commit message if it has none.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGES.md > notes.md
          [ -s notes.md ] || git log -1 --format=%B "$GITHUB_SHA" > notes.md
          gh release view "$GITHUB_REF_NAME" -R "$PUBLIC_REPO" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$PUBLIC_REPO" --target main --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Create the release here too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    name: ${{ matrix.target }}
    needs: page
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS packages contain the desktop app and the command
          # line; `installer` adds a setup program / disk image next to them.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, packages: "-p wdfr -p wdfr-gui", bins: "wdfr.exe wdfr-gui.exe", installer: nsis, label: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, packages: "-p wdfr -p wdfr-gui", bins: "wdfr.exe wdfr-gui.exe", installer: nsis, label: windows-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, packages: "-p wdfr -p wdfr-gui", bins: "wdfr wdfr-gui", installer: dmg, label: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, packages: "-p wdfr -p wdfr-gui", bins: "wdfr wdfr-gui", installer: dmg, label: macos-intel }
          # Linux: a fully static command line, plus the desktop app (which
          # loads the system's graphics libraries, so it is built for glibc).
          # The desktop app is built on the oldest supported Ubuntu, because a
          # glibc program only runs on that glibc version or newer: built on
          # 22.04 it runs on Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: "-p wdfr", bins: "wdfr" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, packages: "-p wdfr", bins: "wdfr" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, packages: "-p wdfr -p wdfr-gui", bins: "wdfr-gui", suffix: "-desktop", installer: linux, label: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, packages: "-p wdfr -p wdfr-gui", bins: "wdfr-gui", suffix: "-desktop", installer: linux, label: linux-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Package
        shell: bash
        run: |
          name=wdfr-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}
          mkdir "$name"
          for b in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          cp README.md LICENSE THIRD-PARTY-NOTICES.txt "$name/"
          # The desktop app embeds Noto Sans Arabic and SC, whose licences must travel with it.
          if [[ "${{ matrix.bins }}" == *wdfr-gui* ]]; then
            cp gui/assets/fonts/OFL.txt "$name/OFL-NotoSansArabic.txt"
            cp gui/assets/fonts/OFL-NotoSansSC.txt "$name/OFL-NotoSansSC.txt"
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          files: ${{ env.ASSET }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}

      # Installers (configured in gui/Cargo.toml). They run after the archive is
      # published, so a failing installer never holds back the plain download.
      # Prebuilt where cargo-quickinstall has them (seconds instead of
      # minutes of compiling); built from source otherwise.
      - name: Install packaging tools
        if: matrix.installer
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8${{ matrix.installer == 'linux' && ',cargo-generate-rpm@0.21.0' || '' }}
      - name: Build installers
        if: matrix.installer
        shell: bash
        env:
          # linuxdeploy is itself an AppImage; this lets it run without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # No version in the name, so that the README can link to
          # releases/latest/download/<name> and always get the newest one.
          base=wdfr-${{ matrix.label }}
          # cargo-packager takes its output folder relative to gui/.
          pkg=gui/pkg
          pack="cargo packager --release --target ${{ matrix.target }} -p wdfr-gui -o pkg"
          mkdir installers
          case "${{ matrix.installer }}" in
            nsis)
              $pack -f nsis
              cp "$pkg"/*.exe "installers/$base-setup.exe" ;;
            dmg)
              # Binaries linked for Intel on an Apple Silicon runner carry no
              # signature at all, and the bundle cannot be signed around them.
              codesign --force -s - target/${{ matrix.target }}/release/wdfr target/${{ matrix.target }}/release/wdfr-gui
              $pack -f app,dmg
              # A bundle that fails this check opens as "damaged" after download.
              codesign --verify --deep --strict --verbose=2 "$pkg"/*.app
              cp "$pkg"/*.dmg "installers/$base.dmg" ;;
            linux)
              $pack -f deb,appimage
              cargo generate-rpm -p gui --target ${{ matrix.target }} -o "$GITHUB_WORKSPACE/$pkg"
              cp "$pkg"/*.deb "installers/$base.deb"
              cp "$pkg"/*.AppImage "installers/$base.AppImage"
              cp "$pkg"/*.rpm "installers/$base.rpm" ;;
          esac
          ls -la installers
      - if: matrix.installer
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          files: installers/*
      - if: matrix.installer
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
