[package]
name = "wdfr-gui"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "Desktop app for Windows Deleted Files Recovery"
authors = ["Bashar Salmo"]
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit", "wayland", "x11"] }
egui-phosphor = "0.14.0"
egui_extras = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
sys-locale = "0.3.2"
unicode-bidi = "0.3.18"
wdfr = { version = "0.2.3", path = ".." }

[build-dependencies]
winresource = "0.1.31"
