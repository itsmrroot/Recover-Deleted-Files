[package]
name = "wdfr-gui"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop app for Deleted Files Recovery"
authors = ["Bashar Salmo"]
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit", "wayland", "x11", "links"] }
egui-phosphor = "0.14.0"
egui_extras = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
sys-locale = "0.3.2"
unicode-bidi = "0.3.18"
ureq = "3.4.2"
wdfr = { version = "0.5.0", path = ".." }

[build-dependencies]
winresource = "0.1.31"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# Installers, built by `cargo packager --release -p wdfr-gui` (see
# .github/workflows/release.yml): Windows setup (NSIS), macOS .app/.dmg,
# Linux .deb and AppImage. The binaries must be built first.
[package.metadata.packager]
product-name = "Deleted Files Recovery"
identifier = "io.github.itsmrroot.wdfr"
description = "Recover deleted photos, videos, music and documents from drives, USB sticks, memory cards and disk images"
homepage = "https://github.com/itsmrroot/Recover-Deleted-Files"
authors = ["Bashar Salmo"]
publisher = "Bashar Salmo"
copyright = "© 2026 Bashar Salmo. Powered by Bashar Salmo."
category = "Utility"
license-file = "../LICENSE"
# One per system: macOS uses the .icns, Windows the .ico, Linux the PNG.
icons = ["assets/wdfr.icns", "assets/wdfr.ico", "assets/icon.png"]
# The command line comes along for scripting and keyboard use.
binaries = [{ path = "wdfr-gui", main = true }, { path = "wdfr", main = false }]
resources = [
    { src = "assets/fonts/OFL.txt", target = "OFL-NotoSansArabic.txt" },
    { src = "assets/fonts/OFL-NotoSansSC.txt", target = "OFL-NotoSansSC.txt" },
]

[package.metadata.packager.macos]
minimum-system-version = "10.13"
# Ad-hoc signature over the whole bundle. Without it the app only carries
# the linker signature, which Gatekeeper reports as "damaged" after a
# download. Replace "-" with a Developer ID to sign and notarize.
signing-identity = "-"

[package.metadata.packager.nsis]
# The app needs administrator rights anyway, so it installs for all users.
installMode = "perMachine"
languages = ["English", "German", "Spanish", "French", "Turkish", "Russian", "Arabic", "SimpChinese"]
display-language-selector = true

[package.metadata.packager.deb]
# wgpu draws with Vulkan or OpenGL; pkexec asks for the password when the
# app restarts with administrator rights.
depends = ["libc6", "libgl1 | libvulkan1", "libxkbcommon0", "pkexec | policykit-1"]

# Fedora / openSUSE package, built by `cargo generate-rpm -p gui` after the
# release build (the .deb and AppImage come from cargo-packager above).
[package.metadata.generate-rpm]
name = "wdfr"
summary = "Recover deleted files from drives, USB sticks, memory cards and disk images"
license = "MIT"
assets = [
    { source = "target/release/wdfr-gui", dest = "/usr/bin/wdfr-gui", mode = "755" },
    { source = "target/release/wdfr", dest = "/usr/bin/wdfr", mode = "755" },
    { source = "gui/assets/linux/wdfr.desktop", dest = "/usr/share/applications/wdfr.desktop", mode = "644" },
    { source = "gui/assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/wdfr.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/wdfr/LICENSE", mode = "644", doc = true },
    { source = "gui/assets/fonts/OFL.txt", dest = "/usr/share/licenses/wdfr/OFL-NotoSansArabic.txt", mode = "644", doc = true },
    { source = "gui/assets/fonts/OFL-NotoSansSC.txt", dest = "/usr/share/licenses/wdfr/OFL-NotoSansSC.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
polkit = "*"
