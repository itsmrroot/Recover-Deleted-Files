<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Deleted Files Recovery — Powered by Bashar Salmo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#0b5cad"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- Icon: a file being restored from a drive -->
  <g transform="translate(96 78)">
    <rect x="0" y="96" width="150" height="70" rx="14" fill="#0b1220" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="124" cy="131" r="7" fill="#38bdf8"/>
    <rect x="20" y="124" width="70" height="14" rx="7" fill="#1e3a5f"/>
    <path d="M40 0h52l26 26v58H40z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M92 0v26h26" fill="#cbd5e1"/>
    <path d="M60 52l12 12 22-24" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 40c40 0 60 30 50 70" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="350" y="138" fill="#ffffff" font-size="46" font-weight="700">Deleted Files Recovery</text>
    <text x="350" y="184" fill="#cbd5e1" font-size="24">Bring back deleted photos, videos, music and documents.</text>
    <rect x="350" y="214" width="268" height="40" rx="20" fill="url(#accent)"/>
    <text x="484" y="240" fill="#0b1220" font-size="18" font-weight="700" text-anchor="middle">Powered by Bashar Salmo</text>
    <text x="640" y="240" fill="#94a3b8" font-size="18">NTFS · FAT32 · exFAT · 50 file types</text>
  </g>
</svg>
